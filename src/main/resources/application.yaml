spring:
  application:
    name: Vector_Act_WAS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vector_act}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# 배포할 문서의 실제 버전을 환경변수로 지정하세요. 미설정 시 가입은 버전 오류로 거절됩니다.
signup:
  terms-version: ${SIGNUP_TERMS_VERSION:}
  privacy-version: ${SIGNUP_PRIVACY_VERSION:}

# CSRF의 세션 쿠키입니다. 인증 토큰 저장용 세션이 아니라 CSRF 검증값을 연결하는 용도입니다.
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${CSRF_SESSION_COOKIE_SECURE:true}
        same-site: lax

auth:
  withdrawal:
    # 삭제 저장소 구현체가 없으면 실패 로그를 남기고 DB를 보존합니다.
    purge-enabled: ${WITHDRAWAL_PURGE_ENABLED:true}
    purge-delay-ms: ${WITHDRAWAL_PURGE_DELAY_MS:3600000}
    purge-initial-delay-ms: ${WITHDRAWAL_PURGE_INITIAL_DELAY_MS:60000}
  withdrawal-rate-limit:
    max-attempts: ${WITHDRAWAL_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${WITHDRAWAL_RATE_LIMIT_WINDOW_SECONDS:60}
  jwt:
    # 최소 32바이트의 무작위 키를 Base64로 인코딩해 환경변수로 전달합니다. 기본 비밀키는 없습니다.
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:vector-act}
  refresh-cookie:
    # 운영은 HTTPS와 Secure=true를 사용합니다. 로컬 HTTP 개발에서만 false로 변경하세요.
    secure: ${REFRESH_COOKIE_SECURE:true}
  login-rate-limit:
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
