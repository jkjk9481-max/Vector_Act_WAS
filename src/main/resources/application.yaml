spring:
  application:
    name: Vector_Act_WAS
  servlet:
    multipart:
      # 컨테이너 상한은 명세에서 가장 큰 업로드(S01 10MiB)에 맞추고, API별 한도는 각 Controller가 검사합니다.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vector_act}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# 배포할 문서의 실제 버전을 환경변수로 지정하세요. 미설정 시 가입은 버전 오류로 거절됩니다.
signup:
  terms-version: ${SIGNUP_TERMS_VERSION:}
  privacy-version: ${SIGNUP_PRIVACY_VERSION:}

# CSRF의 세션 쿠키입니다. 인증 토큰 저장용 세션이 아니라 CSRF 검증값을 연결하는 용도입니다.
server:
  servlet:
    session:
      # CSRF 저장 세션이 기본 30분 유휴 만료로 토큰보다 먼저 사라지지 않도록 기본값을 맞춥니다.
      timeout: ${CSRF_SESSION_TIMEOUT:24h}
      cookie:
        http-only: true
        secure: ${CSRF_SESSION_COOKIE_SECURE:true}
        same-site: lax

auth:
  csrf:
    # 토큰 자체의 고정 유효 기간입니다. 세션이 먼저 종료되면 이 시각 전에도 재발급해야 합니다.
    ttl-seconds: ${CSRF_TTL_SECONDS:86400}
  csrf-rate-limit:
    # A01 GET 발급 요청 전용 제한입니다. 횟수 기준은 설정으로 조정할 수 있습니다.
    max-attempts: ${CSRF_RATE_LIMIT_MAX_ATTEMPTS:60}
    window-seconds: ${CSRF_RATE_LIMIT_WINDOW_SECONDS:60}
  password-reset-rate-limit:
    # 가입 여부와 무관하게 동일 적용합니다. 단일 서버 메모리 기준 15분 동안 IP 10회, 이메일 3회입니다.
    ip-max-attempts: ${PASSWORD_RESET_IP_MAX_ATTEMPTS:10}
    email-max-attempts: ${PASSWORD_RESET_EMAIL_MAX_ATTEMPTS:3}
    window-seconds: ${PASSWORD_RESET_WINDOW_SECONDS:900}
  email-change-rate-limit:
    max-attempts: ${EMAIL_CHANGE_MAX_ATTEMPTS:10}
    window-seconds: ${EMAIL_CHANGE_WINDOW_SECONDS:900}
  email-change-completion-rate-limit:
    max-attempts: ${EMAIL_CHANGE_COMPLETION_MAX_ATTEMPTS:10}
    window-seconds: ${EMAIL_CHANGE_COMPLETION_WINDOW_SECONDS:60}
  profile-image-rate-limit:
    max-attempts: ${PROFILE_IMAGE_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${PROFILE_IMAGE_RATE_LIMIT_WINDOW_SECONDS:60}
  withdrawal:
    # 삭제 저장소 구현체가 없으면 실패 로그를 남기고 DB를 보존합니다.
    purge-enabled: ${WITHDRAWAL_PURGE_ENABLED:true}
    purge-delay-ms: ${WITHDRAWAL_PURGE_DELAY_MS:3600000}
    purge-initial-delay-ms: ${WITHDRAWAL_PURGE_INITIAL_DELAY_MS:60000}
  withdrawal-rate-limit:
    max-attempts: ${WITHDRAWAL_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${WITHDRAWAL_RATE_LIMIT_WINDOW_SECONDS:60}
  jwt:
    # 최소 32바이트의 무작위 키를 Base64로 인코딩해 환경변수로 전달합니다. 기본 비밀키는 없습니다.
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:vector-act}
  refresh-cookie:
    # 운영은 HTTPS와 Secure=true를 사용합니다. 로컬 HTTP 개발에서만 false로 변경하세요.
    secure: ${REFRESH_COOKIE_SECURE:true}
  login-rate-limit:
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# S01·S02 이미지 OCR. 엔진이 연결되지 않으면 작업은 OCR_ENGINE_UNAVAILABLE로 실패합니다.
script:
  ocr:
    async: ${SCRIPT_OCR_ASYNC:true}
    rate-limit:
      max-attempts: ${SCRIPT_OCR_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${SCRIPT_OCR_RATE_LIMIT_WINDOW_SECONDS:60}
    purge-enabled: ${SCRIPT_OCR_PURGE_ENABLED:true}
    purge-delay-ms: ${SCRIPT_OCR_PURGE_DELAY_MS:3600000}
    purge-initial-delay-ms: ${SCRIPT_OCR_PURGE_INITIAL_DELAY_MS:120000}

# 원본 파일 저장소(AWS S3, 서울 리전, 비공개 버킷). 버킷이 비어 있으면 임시 메모리 저장소를 쓰므로 운영에서는 반드시 지정합니다.
# AWS 키는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수로 주입합니다.
storage:
  s3:
    bucket: ${STORAGE_S3_BUCKET:}
    region: ${STORAGE_S3_REGION:ap-northeast-2}
